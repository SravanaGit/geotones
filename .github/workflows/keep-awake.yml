# Supabase pauses free projects after a week without use.
# This asks the database for the station list twice a week so it stays awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 * * 1,4'   # Mondays and Thursdays, 06:00 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database something harmless
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST "$SUPABASE_URL/rest/v1/rpc/map_stations" \
            -H "apikey: $SUPABASE_KEY" -H 'Content-Type: application/json' -d '{}')
          echo "Supabase answered $code"
          test "$code" = 200
